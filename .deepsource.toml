version = 1

test_patterns = [
  "**/*_test.go",
  "frontend/**/*.test.ts",
  "frontend/**/*.test.tsx",
  "frontend/**/*.spec.ts",
  "frontend/**/*.spec.tsx"
]

exclude_patterns = [
  "vendor/**",
  "**/node_modules/**",
  "frontend/coverage/**",
  "frontend/src/components/visualizers/BitmaskDPVisualizer.tsx",
  "frontend/src/components/visualizers/ClimbingStairsVisualizer.tsx",
  "frontend/src/components/visualizers/CoinChangeVisualizer.tsx",
  "frontend/src/components/visualizers/DPJourneyVisualizer.tsx",
  "frontend/src/components/visualizers/GridDPVisualizer.tsx",
  "frontend/src/components/visualizers/HouseRobberVisualizer.tsx",
  "frontend/src/components/visualizers/IntervalDPVisualizer.tsx",
  "frontend/src/components/visualizers/KnapsackDPVisualizer.tsx",
  "frontend/src/components/visualizers/KnapsackVisualizer.tsx",
  "frontend/src/components/visualizers/LCSVisualizer.tsx",
  "frontend/src/components/visualizers/LISVisualizer.tsx",
  "frontend/src/components/visualizers/MultiStateDPVisualizer.tsx",
  "frontend/src/components/visualizers/PalindromeDPVisualizer.tsx",
  "frontend/src/components/visualizers/TreeDPVisualizer.tsx",
  "backend/migrations/**",
  "backend/bin/**",
  ".agents/**",
  ".claude/**"
]

[[analyzers]]
name = "go"
enabled = true

[analyzers.meta]
import_root = "github.com/imrishuroy/algopatterns"

[[analyzers]]
name = "javascript"
enabled = true

[analyzers.meta]
environment = ["nodejs"]
dialect = "typescript"
plugins = ["react"]

