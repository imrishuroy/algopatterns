version = 1

test_patterns = [
  "**/*_test.go",
  "frontend/**/*.test.ts",
  "frontend/**/*.test.tsx",
  "frontend/**/*.spec.ts",
  "frontend/**/*.spec.tsx"
]

exclude_patterns = [
  "vendor/**",
  "**/node_modules/**",
  "frontend/coverage/**",
  "backend/migrations/**",
  "backend/bin/**"
]

[[analyzers]]
name = "go"
enabled = true

  [analyzers.meta]
  import_root = "github.com/imrishuroy/algopatterns"

[[analyzers.ignore]]
code = "RVV-A0006"

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs"]
  dialect = "typescript"
  plugins = ["react"]

[[analyzers.ignore]]
code = "JS-0437"

[[analyzers.ignore]]
code = "JS-0067"

[[analyzers.ignore]]
code = "JS-0415"

[[analyzers.ignore]]
code = "JS-R1005"

[[analyzers.ignore]]
code = "JS-0066"
