version = 1

test_patterns = [
  "**/*_test.go",
  "frontend/**/*.test.ts",
  "frontend/**/*.test.tsx",
  "frontend/**/*.spec.ts",
  "frontend/**/*.spec.tsx"
]

exclude_patterns = [
  "vendor/**",
  "**/node_modules/**",
  "frontend/coverage/**",
  "backend/migrations/**",
  "backend/bin/**"
]

[[analyzers]]
name = "go"
enabled = true

  [analyzers.meta]
  import_root = "github.com/imrishuroy/algopatterns"
  # Disable false positive for HTTP handlers that write to response instead of returning
  disabled_rules = ["RVV-A0006"]

[[analyzers]]
name = "javascript"
enabled = true

  [analyzers.meta]
  environment = ["nodejs"]
  dialect = "typescript"
  plugins = ["react"]
  # Disable rules that conflict with Next.js/React patterns
  disabled_rules = ["JS-0437", "JS-0067", "JS-0415", "JS-R1005", "JS-0066"]
