# SonarCloud Configuration for Backend (Go)
sonar.organization=imrishuroy
sonar.projectKey=algopatterns-backend
sonar.projectName=AlgoPatterns Backend

# Source configuration
sonar.sources=.
sonar.exclusions=**/vendor/**,**/*_test.go,**/testdata/**,**/migrations/**

# Test configuration
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage reports (generated by go test with coverprofile)
sonar.go.coverage.reportPaths=coverage.out

# Language settings
sonar.language=go
sonar.sourceEncoding=UTF-8
